{% extends "gift/base.html" %}
{% load static %}

{% block content %}
<section class="section">
    <div class="container">
        <h2 class="section-title fade-in">Мини-игра 🎮</h2>
        <p class="section-subtitle fade-in">Небольшое испытание для тебя</p>

        <div class="quiz-wrapper" id="quizWrapper">
            <div class="quiz-container glass fade-in" id="quizContainer">
                <div class="quiz-progress">
                    <div class="quiz-progress-bar" id="quizProgressBar"></div>
                    <span class="quiz-progress-text" id="quizProgressText">1 / 5</span>
                </div>

                <div class="quiz-question" id="quizQuestion">
                    <h3 class="quiz-question-text" id="quizQuestionText"></h3>
                    <div class="quiz-options" id="quizOptions"></div>
                </div>
            </div>

            <div class="quiz-result glass" id="quizResult" style="display: none;">
                <div class="quiz-result-icon">✨</div>
                <h3 class="quiz-result-title" id="quizResultTitle"></h3>
                <p class="quiz-result-text" id="quizResultText"></p>
                <button class="btn btn-primary" onclick="restartQuiz()">Пройти ещё раз 🔄</button>
            </div>
        </div>

        <div class="section-nav fade-in">
            <a href="{% url 'gift:final' %}" class="btn btn-primary">Для тебя ➜</a>
        </div>
    </div>
</section>
{% endblock %}
